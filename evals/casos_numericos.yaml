# Casos numericos: gabaritos do acervo (casos/drenagem/*.md) x calculadoras de tools/dren/ x testes de tests/dren/ (F9, 2026-10-08).
# Cada caso aponta para (a) o gabarito em casos/drenagem/, (b) a funcao da calculadora, (c) o teste e (d) a linha de
# tools/dren/DIVERGENCIAS.md, quando houver. Fontes: casos/drenagem/_INDICE.md, evals/sugestoes_casos_numericos_F4.md,
# tools/dren/DIVERGENCIAS.md e os nomes reais dos testes. Formato do Hidraulico (evals/casos_numericos.yaml).
# Campos:
#   id          identificador unico (num-NN; cdv-NN para os casos de aceitacao CDV)
#   caso        caminho do gabarito em casos/drenagem/ (e, depois de "#", o trecho do caso); "livro" quando o gabarito e exemplo de manual
#   modulo      modulo de tools/dren/ (hidrologia, bueiros, canais_drenagem, estradas, drenos, tubos)
#   funcao      funcao chamada no modulo
#   entradas    entradas em SI, como na chamada da calculadora
#   esperado    valor do gabarito do projetista/livro (unidade e fonte doc:pag), NAO o da calculadora
#   tolerancia  tolerancia relativa/absoluta usada no teste
#   status      reproduz | divergencia_>5% | sem_gabarito
#   nota        teste (nome real em tests/dren/), valor calculado, divergencia e hipotese
# ATENCAO (D17): NENHUM caso de casos/drenagem tem check-h (✓h). Todos os gabaritos do acervo sao candidatos (marcas !, ~, ✓*)
# ate a conferencia humana da F7; "reproduz" quer dizer que a calculadora devolve o numero do documento, nao que o documento
# esteja certo. Excecao: casos marcados "livro" (exemplo de manual impresso, nao de acervo).
# Regra D11: divergencia > 5 % nao se ajusta na formula; o teste fica xfail e vai para sessao interativa com o usuario.
# status sem_gabarito: ha caso, mas sem numero ancorado reproduzivel ou sem teste dedicado.

