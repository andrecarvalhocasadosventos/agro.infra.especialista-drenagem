# Casos de roteamento do agente engenheiro-de-drenagem (F9, redação 2026-10-08).
# Campos: id (prefixo-NN, único) · prompt (pt-BR) · esperado (skills que DEVEM ser carregadas; [] = nenhuma)
#         · nao_esperado (skills cuja carga seria erro) · nota (justificativa + marcas PAR, DELEGACAO, NAO-GATILHO, CDV, VIGENCIA).
# Delegação: `delegacao` = blocos [DELEGAR: id] que o agente DEVE emitir; `delegacao_toleravel` = aceitáveis, não exigidos
#         (ids da MATRIZ_DE_INTERFACES §1). A decisão está nos campos; a nota só explica.
# Skills do pacote (8): drenagem-fundamentos (núcleo, pré-carregado), hidrologia-de-projeto-para-drenagem,
# bueiros-e-travessias, drenagem-de-estradas-e-plataformas, canais-de-drenagem-e-macrodrenagem, drenagem-subsuperficial,
# drenagem-normas-e-manuais, drenagem-casos-de-referencia.
# Prefixos: fund · hid · bue · est · can · dsub · nrm · cas (por skill); par (pares vizinhos, os dois sentidos);
# del (delegação) · nao (não-gatilho) · mis (misto) · cdv · vig.
# Os 11 casos herdados do pacote Hidráulico (hid-01..03, bue-01/02/04, dsub-01..04 e est-01, antes bue-03) foram
# incorporados com nomes de skill corrigidos; `bueiros-e-drenagem-superficial` virou bueiros-e-travessias ou
# drenagem-de-estradas-e-plataformas conforme o tema.

# ---------------------------------------------------------------- núcleo
- id: fund-01
  prompt: 'Vou começar a drenagem de um perímetro irrigado de 3.200 ha no oeste da Bahia, com 18 km de canal de adução e estrada de serviço paralela. Por onde você começa, que dados mínimos precisa de mim e qual o fluxo até o parecer?'
  esperado:
  - drenagem-fundamentos
  nao_esperado: []
  nota: 'Pedido amplo (fluxo de 8 passos, dados mínimos, formato do parecer) responde o núcleo. Skills de disciplina são toleráveis como remissão. Sem skill de disciplina obrigatória.'
  delegacao: []
  delegacao_toleravel: []
- id: fund-02
  prompt: 'Em quais situações você delega em vez de resolver, e como é o formato do bloco de delegação? Quero entender isso antes de te passar um trecho com bueiro, valeta e dreno de fundo.'
  esperado:
  - drenagem-fundamentos
  nao_esperado:
  - drenagem-casos-de-referencia
  nota: 'Protocolo [DELEGAR], fronteiras e o que se pede a cada companheiro estão no núcleo (§4). Disciplinas toleráveis só como exemplo. Nenhum bloco emitido: a pergunta é conceitual.'
  delegacao: []
  delegacao_toleravel: []
- id: fund-03
  prompt: 'Que dados você precisa de mim para dimensionar um dreno agrícola e que dados para uma travessia de talvegue? E quais regras V você confere antes de entregar o parecer?'
  esperado:
  - drenagem-fundamentos
  nao_esperado:
  - drenagem-normas-e-manuais
  nota: 'Dados mínimos por tipo de pedido e V1-V18 vêm do núcleo/perfil. PAR núcleo x disciplina: drenagem-subsuperficial e bueiros-e-travessias são toleráveis como remissão, mas o pedido não traz número para calcular.'
  delegacao: []
  delegacao_toleravel: []

# ---------------------------------------------------------------- hidrologia de projeto
- id: hid-01
  prompt: 'Bacia de 8 km², talvegue de 6,2 km e desnível de 140 m. Calcule o tempo de concentração por Kirpich e por Giandotti e diga qual a faixa de validade de cada um para uma bacia do semiárido.'
  esperado:
  - hidrologia-de-projeto-para-drenagem
  nao_esperado:
  - drenagem-subsuperficial
  - canais-de-drenagem-e-macrodrenagem
  nota: 'Herdado (era hid-01). Tc por duas fórmulas com faixa (V8). bueiros-e-travessias tolerável; a IDF, se faltar, vira DELEGACAO: [DELEGAR: clima] sem reprovar.'
  delegacao: []
  delegacao_toleravel: [clima]
- id: hid-02
  prompt: 'Para uma bacia de 120 ha, uso o método racional ou o SCS? Qual TR para um bueiro de estrada vicinal e qual para um extravasor de reservatório? C de 0,35 e i de 78 mm/h já informados.'
  esperado:
  - hidrologia-de-projeto-para-drenagem
  nao_esperado:
  - drenagem-subsuperficial
  - canais-de-drenagem-e-macrodrenagem
  nota: 'Herdado (era hid-02). Escolha do método pela área (V7) e TR por obra com risco (V6). drenagem-normas-e-manuais tolerável (IPR-715). O extravasor é só pergunta de TR, não pedido de dimensionamento.'
  delegacao: []
  delegacao_toleravel: []
- id: hid-03
  prompt: 'Hidrograma de projeto pelo SCS para uma bacia de 18 km² com CN 78, Tc de 3,1 h e chuva de 140 mm em 24 h (dado do projeto). Quero pico e volume escoado.'
  esperado:
  - hidrologia-de-projeto-para-drenagem
  nao_esperado:
  - drenagem-subsuperficial
  - drenagem-de-estradas-e-plataformas
  nota: 'Herdado (era hid-03). SCS-CN com hidrograma unitário triangular; a chuva já veio dada, então não é caso de delegação ao clima. Laminação em reservatório seria da Hidráulica, mas não é pedida.'
  delegacao: []
  delegacao_toleravel: [hidraulica]
- id: hid-04
  prompt: 'Tenho 14 postos com series de chuva diária e preciso de C ponderado para uma bacia com 40 % de pastagem, 35 % de caatinga arbustiva e 25 % de solo exposto. Qual C uso e qual o limite de área para o racional que vocês adotam?'
  esperado:
  - hidrologia-de-projeto-para-drenagem
  nao_esperado:
  - drenagem-subsuperficial
  - bueiros-e-travessias
  nota: 'C ponderado e limite de área do racional (ponto aberto, rotular padrão provisório e alternativas 80 ha, 2 km², 3 km²). Os 14 postos são ruído; ajuste de série e IDF não são do pacote (nenhum bloco obrigatório).'
  delegacao: []
  delegacao_toleravel: [clima]
- id: hid-05
  prompt: 'A planilha do projetista usa NERC para o Tc e chama de Kirpich. A bacia tem L = 13,2 km e desnível de 32 m. Confira o Tc e diga se a velocidade implícita faz sentido.'
  esperado:
  - hidrologia-de-projeto-para-drenagem
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'Conferência de Tc com rótulo trocado (V8, V14). drenagem-casos-de-referencia é tolerável (caso Delmiro). Divergência é apontada, não corrigida.'
  delegacao: []
  delegacao_toleravel: []

# ---------------------------------------------------------------- bueiros e travessias
- id: bue-01
  prompt: 'Bueiro celular duplo 2,5 × 2,5 m sob o canal, Q = 62 m³/s (já definida), declividade 0,005, comprimento 40 m, tailwater 1,8 m. Verifique controle de entrada e de saída e dê o HW.'
  esperado:
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-subsuperficial
  - hidrologia-de-projeto-para-drenagem
  nota: 'Herdado (era bue-01). Vazão dada: só a skill (V2, dois controles). hidrologia-de-projeto-para-drenagem não deve ser carregada porque a vazão não é pedida (PAR hidrologia x bueiros, sentido bueiros). drenagem-normas-e-manuais (HDS-5) tolerável.'
  delegacao: []
  delegacao_toleravel: []
- id: bue-02
  prompt: 'Uma bacia de 14 km² corta o traçado do canal. Estime a vazão de TR 100 e depois dimensione o bueiro celular para passar essa vazão, com HW máximo de 4 m acima da geratriz inferior.'
  esperado:
  - hidrologia-de-projeto-para-drenagem
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-subsuperficial
  - canais-de-drenagem-e-macrodrenagem
  nota: 'Herdado (era bue-02, sem a pista numérica da resposta). PAR hidrologia x bueiros, sentido pedido-misto: vazão mais obra, cadeia hidrologia -> bueiro. A chuva de TR 100 vem do Clima: DELEGACAO: [DELEGAR: clima] esperado (ou IDF emprestada rotulada), mas as duas skills são obrigatórias.'
  delegacao: [clima]
  delegacao_toleravel: []
- id: bue-03
  prompt: 'Meu bueiro tubular DN 1500 tem controle de entrada dando HW de 4,8 m e o de saída 3,4 m. Qual governa? E por que o método legado de orifício me deu 4,5 m?'
  esperado:
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-subsuperficial
  - drenagem-de-estradas-e-plataformas
  nota: 'Herdado (era bue-04). V2: vale o maior HW; legado só como comparação rotulada (subestima HW, ver DIVERGENCIAS Baixio). drenagem-normas-e-manuais tolerável (HDS-5 p. 72).'
  delegacao: []
  delegacao_toleravel: []
- id: bue-04
  prompt: 'A velocidade de saída do bueiro celular deu 5,6 m/s para jusante em areia fina. O que o critério diz, qual o Froude de saída e o que eu informo na saída?'
  esperado:
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-subsuperficial
  - canais-de-drenagem-e-macrodrenagem
  nota: 'V3: V de saída x limite do material (Tab. 31 DNIT), Fr com A/T, aviso "precisa de dissipador". O dissipador em si não é dimensionado aqui: DELEGACAO: [DELEGAR: hidraulica] (D3) esperado.'
  delegacao: [hidraulica]
  delegacao_toleravel: []
- id: bue-05
  prompt: 'Preciso do bueiro de uma travessia de vicinal com 2,8 m de aterro sobre a geratriz, Q de 3,4 m³/s, declive 0,8 %, saída livre. Quantas linhas de DN 1000 em concreto, e qual a classe do tubo indicativa?'
  esperado:
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'Número de linhas e classe de tubo INDICATIVA (NBR 8890 via ABTC, não transcrita). Armadura e dimensionamento estrutural do tubo seriam Estruturas, mas não são pedidos. Sem DELEGAR obrigatório.'
  delegacao: []
  delegacao_toleravel: [estruturas]
- id: bue-06
  prompt: 'O quadro de bueiros da projetista tem 59 obras sob o canal adutor. Pegue três delas e confira cota de entrada, cota de saída e declividade, e me diga se o greide faz sentido.'
  esperado:
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'Conferência de planilha de projetista (V5, V14, monotonia de cotas). drenagem-casos-de-referencia é tolerável (caso CAC B31). A discrepância é apontada com evidência, não corrigida.'
  delegacao: []
  delegacao_toleravel: []

# ---------------------------------------------------------------- drenagem de estradas e plataformas
- id: est-01
  prompt: 'Dimensione a descida d''água em degraus e a sarjeta triangular do talude de aterro da estrada de serviço, para o escoamento de uma faixa de 60 m de pista.'
  esperado:
  - drenagem-de-estradas-e-plataformas
  nao_esperado:
  - drenagem-subsuperficial
  - bueiros-e-travessias
  nota: 'Herdado (era bue-03). Descida d''água e sarjeta: drenagem-de-estradas-e-plataformas. hidrologia-de-projeto-para-drenagem tolerável para o Q da faixa. Sem IDF nem i no pedido, o Q da faixa exige DELEGACAO: [DELEGAR: clima] (obrigatório). Energia nos degraus/dissipador seria da Hidráulica, só se pedido: [DELEGAR: hidraulica] tolerável.'
  delegacao: [clima]
  delegacao_toleravel: [hidraulica]
- id: est-02
  prompt: 'Valeta de crista trapezoidal b = 0,40 m, talude 1:1, h = 0,40 m, n 0,016, i = 0,3 %. Faixa contribuinte de 80 m de talude mais 40 m de terreno natural, TR 10. Qual o comprimento crítico?'
  esperado:
  - drenagem-de-estradas-e-plataformas
  nao_esperado:
  - canais-de-drenagem-e-macrodrenagem
  - bueiros-e-travessias
  nota: 'Comprimento crítico de valeta VPC (calculadora `estradas`), TR 10 e Tc mínimo como padrões provisórios rotulados. O pedido não traz IDF nem i: DELEGACAO: [DELEGAR: clima] (obrigatório).'
  delegacao: [clima]
  delegacao_toleravel: []
- id: est-03
  prompt: 'Sarjeta composta de 0,60 m de faixa deprimida, Sx 3 %, Sw 8 %, declividade longitudinal 1,2 %. Quanto a sarjeta escoa para um espalhamento de 2,5 m e onde ponho a caixa coletora com grelha?'
  esperado:
  - drenagem-de-estradas-e-plataformas
  nao_esperado:
  - canais-de-drenagem-e-macrodrenagem
  nota: 'Sarjeta composta (HEC-12) e caixa com grelha (vertedor x orifício, aviso na transição, colmatação em ponto baixo como ponto aberto). Só a skill.'
  delegacao: []
  delegacao_toleravel: [clima]
- id: est-04
  prompt: 'As valas de proteção do projeto da estrada de acesso do Castanhão usam a chuva em mm no lugar de mm/h. Refaça a vazão por metro e me diga o quanto a projetista errou.'
  esperado:
  - drenagem-de-estradas-e-plataformas
  - drenagem-casos-de-referencia
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'PAR estradas x casos: conferência de caso real negativo (V11, V14, razão de ~12 vezes no acervo, sem ✓h). Casos fornece o caso, estradas a calculadora. Divergência apontada, o número da projetista não é alterado.'
  delegacao: []
  delegacao_toleravel: [clima]

# ---------------------------------------------------------------- canais de drenagem e macrodrenagem
- id: can-01
  prompt: 'Dreno trapezoidal em terra com b = 2,0 m, talude 1,5:1, declividade 0,0012 e n 0,030 para Q = 7,5 m³/s. Dê tirante normal, velocidade, Froude e confira velocidade admissível e folga.'
  esperado:
  - canais-de-drenagem-e-macrodrenagem
  nao_esperado:
  - drenagem-subsuperficial
  - bueiros-e-travessias
  nota: 'Seção por Manning, Fr com A/T (V4), V admissível por tabela com fonte (V10), folga (V5). Q dada: hidrologia não necessária.'
  delegacao: []
  delegacao_toleravel: []
- id: can-02
  prompt: 'O macrodreno do projeto tem seção de 0,20 m de altura e a planilha dá tirante de 0,33 m para Q = 0,52 m³/s, com folga declarada de 0,02 m. Isso fecha? Quantos trechos da planilha estão com folga abaixo de 25 %?'
  esperado:
  - canais-de-drenagem-e-macrodrenagem
  nao_esperado:
  - bueiros-e-travessias
  nota: 'Conferência de planilha (tirante x altura da seção, folga 25 % como padrão provisório, V5/V14). drenagem-casos-de-referencia tolerável (Delmiro). CDV não envolvido.'
  delegacao: []
  delegacao_toleravel: []
- id: can-03
  prompt: 'O dreno desce 4 m em 600 m de extensão até o rio. Quero degraus ou queda, posição e altura, e o que fazer no deságue para não erodir o leito.'
  esperado:
  - canais-de-drenagem-e-macrodrenagem
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'Degraus e deságue de canal de drenagem. A bacia de dissipação formal (energia, ressalto) seria Hidráulica: DELEGACAO: [DELEGAR: hidraulica] se o usuário pedir dissipador; aqui o enunciado é de degrau e proteção de deságue.'
  delegacao: []
  delegacao_toleravel: [hidraulica]
- id: can-04
  prompt: 'Preciso decidir entre canal revestido em gabião e tubo DN 1000 em PEAD para um trecho de 800 m com declividade de 0,4 % e Q de 1,1 m³/s. Compare a capacidade por Manning para a faixa de n de cada material.'
  esperado:
  - canais-de-drenagem-e-macrodrenagem
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'Retroanálise gabião x tubo (caso do acervo, fonte local D8). Capacidade por Manning é da skill; o pedido é só a capacidade por Manning; a escolha por custo seria [DELEGAR: orcamento] (V17) com quantitativos, tolerável (obrigatório só se a recomendação final for dada).'
  delegacao: []
  delegacao_toleravel: [orcamento]

# ---------------------------------------------------------------- drenagem subsuperficial
- id: dsub-01
  prompt: 'Espaçamento de drenos agrícolas por Hooghoudt: K = 0,8 m/dia, camada impermeável a 4,5 m, recarga de 5 mm/dia, drenos a 1,6 m, quero o lençol a 1,0 m no ponto médio entre drenos.'
  esperado:
  - drenagem-subsuperficial
  nao_esperado:
  - canais-de-drenagem-e-macrodrenagem
  - hidrologia-de-projeto-para-drenagem
  - bueiros-e-travessias
  nota: 'Herdado. Só a skill (Hooghoudt, profundidade equivalente, viés do método declarado, V12). K real e profundidade da camada são dados da Geotecnia e a recarga da Irrigação: premissa rotulada; DELEGACAO: [DELEGAR: geotecnia] e [DELEGAR: irrigacao] toleráveis.'
  delegacao: []
  delegacao_toleravel: [geotecnia, irrigacao]
- id: dsub-02
  prompt: 'O canal em geomembrana passa em corte com lençol freático alto. Preciso do dreno de fundo para aliviar a subpressão com o canal vazio: vazão por furo na geomembrana, 2 tubos DN200 e a carga admissível.'
  esperado:
  - drenagem-subsuperficial
  nao_esperado:
  - bueiros-e-travessias
  - hidrologia-de-projeto-para-drenagem
  nota: 'Herdado, corrigido (a skill canais-abertos é do Hidráulico e não existe neste pacote). PAR subsuperficial x canais de drenagem, sentido subsuperficial: dreno de fundo e subpressão. O envoltório real do tubo é DELEGACAO: [DELEGAR: geotecnia] (toleravel); seção e NA do canal de adução são dados do Hidráulico.'
  delegacao: []
  delegacao_toleravel: [geotecnia, hidraulica]
- id: dsub-03
  prompt: 'Capacidade do tubo dreno PEAD DN160 com i = 0,3 %, comprimento de linha de 400 m e q = 1,2 L/s/ha em 6 ha por lateral. Cabe? Qual a velocidade?'
  esperado:
  - drenagem-subsuperficial
  nao_esperado:
  - canais-de-drenagem-e-macrodrenagem
  - drenagem-de-estradas-e-plataformas
  nota: 'Herdado. Capacidade do tubo dreno como conduto livre (Manning, D-86 em aberto: só o André decide o DN). Ponto de atenção da skill: o 1,2 L/s/ha é coeficiente de coletor e não de drenagem superficial.'
  delegacao: []
  delegacao_toleravel: []
- id: dsub-04
  prompt: 'Os coletores de 600 ha de drenos agrícolas deságuam num canal de drenagem aberto. Dimensione os coletores e o canal coletor para q de projeto de 1,2 L/s/ha.'
  esperado:
  - drenagem-subsuperficial
  - canais-de-drenagem-e-macrodrenagem
  nao_esperado:
  - bueiros-e-travessias
  nota: 'Herdado. PAR subsuperficial x canais de drenagem, sentido misto: coletores em drenagem-subsuperficial e canal coletor aberto em canais-de-drenagem-e-macrodrenagem. q de projeto depende da Irrigação (recarga): DELEGACAO: [DELEGAR: irrigacao] toleravel.'
  delegacao: []
  delegacao_toleravel: [irrigacao]

# ---------------------------------------------------------------- normas e manuais
- id: nrm-01
  prompt: 'Onde está a tabela de Ke de entrada no IPR-724 e em que página do HDS-5? E por que os dois divergem para muro de ala paralelo?'
  esperado:
  - drenagem-normas-e-manuais
  nao_esperado:
  - hidrologia-de-projeto-para-drenagem
  nota: 'Localização de fonte e divergência entre fontes (0,7 HDS-5 x 0,2 DNIT, ponto aberto, padrão provisório 0,7). PAR normas x bueiros, sentido normas: não há bueiro para calcular. bueiros-e-travessias tolerável como remissão.'
  delegacao: []
  delegacao_toleravel: []
- id: nrm-02
  prompt: 'O que o IPR-715 exige de TR para drenagem de rodovia e o que a EM 1110-2-1601 diz de velocidade em canal revestido em concreto? Preciso citar página no relatório.'
  esperado:
  - drenagem-normas-e-manuais
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'Guia de fontes com página (V1, V16). canais-de-drenagem-e-macrodrenagem tolerável para a velocidade admissível. Nenhum cálculo pedido.'
  delegacao: []
  delegacao_toleravel: []
- id: nrm-03
  prompt: 'Usei o ábaco do HDS-5 para um bueiro de 1,5 m de diâmetro com Q = 4,2 m³/s e declividade de 0,6 %. Qual o HW/D e qual o controle que governa? Aplique o método.'
  esperado:
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-normas-e-manuais
  nota: 'PAR normas x bueiros, sentido bueiros: o pedido é aplicar o método (calculadora), não localizar a fonte. A skill de normas pode ser lida de passagem, mas não é obrigatória.'
  delegacao: []
  delegacao_toleravel: []
- id: nrm-04
  prompt: 'A NBR 8890 está no corpus de vocês? Preciso da tabela de classes de tubo de concreto para o relatório; posso colar a tabela aqui?'
  esperado:
  - drenagem-normas-e-manuais
  nao_esperado:
  - bueiros-e-travessias
  nota: 'VIGENCIA. NBR 8890:2020 é norma fechada (NAO-ABERTA): citar como referência, indicar o que está disponível via ABTC, nunca transcrever a tabela. Não calcular classe.'
  delegacao: []
  delegacao_toleravel: []

# ---------------------------------------------------------------- casos de referência
- id: cas-01
  prompt: 'Como o projeto de Delmiro Gouveia dimensionou os bueiros tubulares sob o canal principal? Que TR e que critério de y/D eles usaram, e como isso se compara ao que vocês adotam?'
  esperado:
  - drenagem-casos-de-referencia
  - bueiros-e-travessias
  nao_esperado:
  - drenagem-subsuperficial
  nota: 'PAR casos x bueiros, sentido casos: o pedido é "como o projeto fez" e comparar. Ancoragem doc:pág com marca (nenhum caso tem ✓h); comparação com o critério provisório y/D 75 %.'
  delegacao: []
